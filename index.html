<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ballistic Turret Calculator</title>
<style>
  :root {
    --bg: #0e1116;
    --card: #171c24;
    --accent: #4ea1ff;
    --accent2: #38d39f;
    --text: #e6edf3;
    --muted: #8b98a5;
    --border: #262d38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
  }
  @media (min-height: 760px) {
    body { align-items: center; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input, select {
    width: 100%;
    padding: 12px 14px;
    background: #0e1116;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .toggle { display: flex; gap: 8px; margin-top: 6px; }
  .toggle button {
    flex: 1; padding: 10px; border-radius: 10px; cursor: pointer;
    background: #0e1116; border: 1px solid var(--border); color: var(--muted);
    font-size: 14px; font-weight: 600;
  }
  .toggle button.active { background: var(--accent); border-color: var(--accent); color: #04121f; }
  .result {
    margin-top: 24px; padding: 20px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(78,161,255,.12), rgba(56,211,159,.12));
    border: 1px solid var(--border); text-align: center;
  }
  .rlabel { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
  .clicks { font-size: 46px; font-weight: 800; color: var(--accent2); line-height: 1; }
  .clicks span { font-size: 18px; color: var(--muted); font-weight: 600; }
  .breakdown { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .detail { margin-top: 8px; font-size: 12px; color: var(--muted); }
  details { margin-top: 20px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .advanced { margin-top: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Ballistic Turret Calculator</h1>
  <div class="sub">How many clicks to dial for a given drop &amp; distance.</div>

  <label>Distance (m)</label>
  <input id="distance" type="number" inputmode="decimal" value="300" min="0" step="1">

  <label>Elevation — bullet drop</label>
  <div class="row">
    <div><input id="drop" type="number" inputmode="decimal" value="1.3" min="0" step="0.1"></div>
    <div class="toggle" style="flex:0 0 210px">
      <button id="moaBtn" onclick="setUnit('elev','MOA')">MOA</button>
      <button id="mradBtn" class="active" onclick="setUnit('elev','MRAD')">MRAD</button>
      <button id="cmBtn" onclick="setUnit('elev','CM')">cm</button>
    </div>
  </div>

  <div class="result">
    <div class="rlabel">Elevation (dial UP)</div>
    <div class="clicks" id="clicksOut">–</div>
    <div class="breakdown" id="breakdown"></div>
    <div class="detail" id="detail"></div>
  </div>

  <label>Windage — drift</label>
  <div class="row">
    <div><input id="wind" type="number" inputmode="decimal" value="0" min="0" step="0.1"></div>
    <div class="toggle" style="flex:0 0 210px">
      <button id="wmoaBtn" onclick="setUnit('wind','MOA')">MOA</button>
      <button id="wmradBtn" class="active" onclick="setUnit('wind','MRAD')">MRAD</button>
      <button id="wcmBtn" onclick="setUnit('wind','CM')">cm</button>
    </div>
  </div>
  <div class="toggle" style="margin-top:8px">
    <button id="leftBtn" class="active" onclick="setWindDir('L')">◀ Left</button>
    <button id="rightBtn" onclick="setWindDir('R')">Right ▶</button>
  </div>

  <div class="result">
    <div class="rlabel" id="windDirLabel">Windage (dial LEFT)</div>
    <div class="clicks" id="wClicksOut">–</div>
    <div class="breakdown" id="wBreakdown"></div>
    <div class="detail" id="wDetail"></div>
  </div>

  <details>
    <summary>Turret settings</summary>
    <div class="advanced">
      <label>Click value (cm per 100 m)</label>
      <input id="clickCm" type="number" inputmode="decimal" value="0.25" min="0.01" step="0.01">
      <label>Clicks per numbered mark</label>
      <input id="clicksPerMark" type="number" inputmode="numeric" value="4" min="1" step="1">
      <label>Marks per full turn</label>
      <input id="marksPerTurn" type="number" inputmode="numeric" value="36" min="1" step="1">
    </div>
  </details>
</div>

<script>
const MOA_CM_PER_100M = 2.908882;   // 1 MOA subtends 2.908882 cm at 100 m
const MRAD_CM_PER_100M = 10;        // 1 MRAD subtends 10 cm at 100 m
let elevUnit = 'MRAD';
let windUnit = 'MRAD';
let windDir = 'L';

function setUnit(which, u) {
  const ELEV_DEFAULTS = { MOA: '4.6', MRAD: '1.3' };
  if (which === 'elev') {
    // Swap in the typical default for the newly selected angular unit.
    if (ELEV_DEFAULTS[u]) drop.value = ELEV_DEFAULTS[u];
    elevUnit = u;
    moaBtn.classList.toggle('active', u === 'MOA');
    mradBtn.classList.toggle('active', u === 'MRAD');
    cmBtn.classList.toggle('active', u === 'CM');
  } else {
    windUnit = u;
    wmoaBtn.classList.toggle('active', u === 'MOA');
    wmradBtn.classList.toggle('active', u === 'MRAD');
    wcmBtn.classList.toggle('active', u === 'CM');
  }
  calc();
}

function setWindDir(d) {
  windDir = d;
  leftBtn.classList.toggle('active', d === 'L');
  rightBtn.classList.toggle('active', d === 'R');
  calc();
}

// Returns {clicks, rawClicks, offsetCm, clickCmAtDist} or null if invalid.
function solve(angVal, unit, dist, clickVal) {
  if (!(dist > 0) || !(angVal >= 0) || !(clickVal > 0)) return null;
  const factor = dist / 100;
  // For CM the entered value is already the linear offset at the target;
  // MOA/MRAD are angular and scale with distance.
  const offsetCm = unit === 'CM'
    ? angVal
    : angVal * (unit === 'MOA' ? MOA_CM_PER_100M : MRAD_CM_PER_100M) * factor;
  const clickCmAtDist = clickVal * factor;
  const rawClicks = offsetCm / clickCmAtDist;
  return { clicks: Math.round(rawClicks), rawClicks, offsetCm, clickCmAtDist };
}

function render(r, dist, perMark, perTurn, labelWord, outEl, breakdownEl, detailEl) {
  if (!r) {
    outEl.textContent = '–';
    breakdownEl.textContent = '';
    detailEl.textContent = '';
    return;
  }
  outEl.innerHTML = r.clicks + ' <span>clicks</span>';
  if (perMark > 1) {
    const totalMarks = Math.floor(r.clicks / perMark);
    const rem = r.clicks % perMark;
    let text;
    if (perTurn > 1) {
      const turns = Math.floor(totalMarks / perTurn);
      const mark = totalMarks % perTurn;
      const parts = [];
      if (turns > 0) parts.push(`${turns} turn${turns !== 1 ? 's' : ''}`);
      parts.push(`mark ${mark}`);
      parts.push(`+ ${rem} click${rem !== 1 ? 's' : ''}`);
      text = parts.join(' · ');
    } else {
      text = `${totalMarks} mark${totalMarks !== 1 ? 's' : ''} + ${rem} click${rem !== 1 ? 's' : ''}`;
    }
    breakdownEl.textContent = text;
  } else {
    breakdownEl.textContent = '';
  }
  detailEl.textContent =
    `${labelWord} = ${r.offsetCm.toFixed(2)} cm · 1 click = ${r.clickCmAtDist.toFixed(3)} cm @ ${dist} m · raw ${r.rawClicks.toFixed(2)}`;
}

function calc() {
  const dist = parseFloat(distance.value);
  const clickVal = parseFloat(clickCm.value);
  const perMark = parseInt(clicksPerMark.value, 10);
  const perTurn = parseInt(marksPerTurn.value, 10);

  render(solve(parseFloat(drop.value), elevUnit, dist, clickVal),
    dist, perMark, perTurn, 'Drop', clicksOut, breakdown, detail);

  windDirLabel.textContent = `Windage (dial ${windDir === 'L' ? 'LEFT' : 'RIGHT'})`;
  render(solve(parseFloat(wind.value), windUnit, dist, clickVal),
    dist, perMark, perTurn, 'Drift', wClicksOut, wBreakdown, wDetail);
}

document.querySelectorAll('input').forEach(el => el.addEventListener('input', calc));
calc();
</script>
</body>
</html>
